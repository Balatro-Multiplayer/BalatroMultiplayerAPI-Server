services:
  emqx:
    image: emqx/emqx:5.8
    container_name: bmp-emqx
    ports:
      - "8883:8883"
    environment:
      EMQX_NAME: bmp-emqx
    volumes:
      - ./apps/server/emqx/cluster.hocon:/opt/emqx/etc/cluster.hocon:ro
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - bmp

  postgres:
    image: postgres:16-alpine
    container_name: bmp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bmp
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - bmp

  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: bmp-api
    ports:
      - "127.0.0.1:8788:8788"
    env_file: ./apps/server/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bmp
      EMQX_BROKER_URL: mqtt://emqx:1883
      EMQX_API_URL: http://emqx:18083/api/v5
      WEB_BASE_URL: ${WEB_BASE_URL:-https://new.balatromp.com}
      # Unset this and chat falls back to the local obscenity filter, exactly
      # as before the bridge existed.
      MODERATION_SERVICE_URL: ${MODERATION_SERVICE_URL-http://moderation:8001}
      MODERATION_BEARER_TOKEN: ${MODERATION_BEARER_TOKEN:-dev-moderation-token}
    depends_on:
      emqx:
        condition: service_healthy
      postgres:
        condition: service_healthy
      moderation:
        condition: service_started
    restart: unless-stopped
    networks:
      - bmp

  moderation:
    build:
      context: .
      dockerfile: apps/moderation/Dockerfile
    container_name: bmp-moderation
    # No host port: only the api talks to it, over the compose network.
    environment:
      MODERATION_BEARER_TOKEN: ${MODERATION_BEARER_TOKEN:-dev-moderation-token}
      # Must equal the cpus limit below - llama.cpp threads spin-wait, so
      # oversubscribing collapses throughput rather than degrading it.
      GUARD_THREADS: ${GUARD_CPUS:-4}
      # Logs what it WOULD block without blocking. Set 0 to enforce.
      SHADOW_MODE: ${SHADOW_MODE:-1}
    volumes:
      # The GGUF is not in the image. Drop it here and the service finds it at
      # the path baked into the Dockerfile.
      - moderation-model-cache:/model-cache
    deploy:
      resources:
        limits:
          cpus: ${GUARD_CPUS:-4}
          # ~3.7 GiB resident once the model loads; below ~4G the first
          # judgement is an OOM kill.
          memory: ${GUARD_MEMORY:-6G}
    restart: unless-stopped
    networks:
      - bmp

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: bmp-web
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      API_SERVER_URL: http://bmp-api:8788
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - bmp

networks:
  bmp:
    name: bmp

volumes:
  emqx-data:
  emqx-log:
  pg-data:
  moderation-model-cache:
